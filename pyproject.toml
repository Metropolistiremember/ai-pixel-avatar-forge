[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pixel-avatar-forge"
version = "0.6.3"
description = "Plugin-host desktop tool that generates AI pixel-art avatars (PFPs) from prompt + style packs."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "forge-crew", email = "crew@ai-pixel-avatar-forge.dev" }]
keywords = ["pixel-art", "avatar", "pfp", "diffusion", "plugin-host", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.2.0", "torchvision>=0.17.0"]
cpu = ["onnxruntime>=1.17.0"]
dev = ["pytest>=8.0.0", "pytest-qt>=4.4.0", "ruff>=0.4.0", "mypy>=1.9.0"]

[project.scripts]
forge = "avatar_forge.bootstrap.launcher:main"
forge-plugin = "avatar_forge.bootstrap.plugin_cli:main"

[project.entry-points."avatar_forge.plugins"]
# Built-in plugins register here; third-party packs drop wheels that
# declare the same group and get picked up by the registry on scan.
pixel_diffusion = "avatar_forge.extensions.pixel_diffusion.plugin:PixelDiffusionPlugin"
palette_quantizer = "avatar_forge.extensions.palette_quantizer.plugin:PaletteQuantizerPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["avatar_forge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true